
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Bibliothèque Numérique</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .login-header h1 {
            color: #243447;
            font-size: 25px;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 7px;
        }

        .btn-login {
            background: #243447;
            color: white;
            padding: 12px;
            border-radius: 7px;
            font-weight: bold;
            width: 100%;
            border: none;
        }

        .btn-login:hover {
            background: #344d68;
            color: white;
        }

        .footer-text {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container px-3">

    <div class="login-card mx-auto">

        <div class="login-header">
            <div class="login-icon">📚</div>

            <h1>Bibliothèque Numérique</h1>

            <p class="text-muted mb-0">
                Connectez-vous à votre compte
            </p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger">
                Nom d'utilisateur ou mot de passe incorrect.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Nom d'utilisateur
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Votre nom d'utilisateur"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">
                    Mot de passe
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Votre mot de passe"
                    autocomplete="current-password"
                    required
                >
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit" class="btn btn-login">
                Se connecter
            </button>
        </form>

        <div class="footer-text">
            Bibliothèque Numérique — Tous droits réservés
        </div>

    </div>

</div>

</body>
</html>
