
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Demander un emprunt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <h1>Demander un emprunt</h1>

    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label class="form-label">Choisir un exemplaire</label>

        <select name="exemplaire" class="form-select mb-3" required>
            <option value="">-- Choisir --</option>

            {% for exemplaire in exemplaires %}
                <option value="{{ exemplaire.id }}">
                    {{ exemplaire.document.titre }}
                    - {{ exemplaire.code_inventaire }}
                </option>
            {% empty %}
                <option disabled>Aucun exemplaire disponible</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-primary">
            Envoyer ma demande
        </button>
    </form>

    <a href="{% url 'mes_emprunts' %}" class="btn btn-secondary mt-3">
        Voir mes emprunts
    </a>

</body>
</html>
